      <section class="py-16 bg-domus-light">
      <div class="container mx-auto px-4 max-w-6xl">
        <h2 class="text-4xl font-bold text-center text-domus-primary mb-12">
          Encarge su dulce
        </h2>

        <!-- Seccion de dulces a encargar: -->
        <div class="w-full">
          <!-- Grid de dulces -->
          <div 
          [classList]="grid_classes()"
          class="w-full text-xl">

          @if(encargos().length == 0){
            <div 
            (click)="agregar_encargo()"
            class="w-full aspect-square rounded-lg border-4 border-dashed border-green-500 flex
            justify-center text-center items-center text-green-500 cursor-pointer
            hover:text-green-700 transition-colors max-w-lg">
            <p class="flex justify-center w-full items-center">
                <ng-icon class="text-6xl" name="agregar" />
                <span class="text-2xl">Agregar un encargo</span>
            </p>
          </div>
          } @else {
            @for (encargo of encargos(); track $index) {
              <card-encargo-component 
              class="max-w-lg"
              [index]="$index" 
              [encargo]="encargo" />
            }
          }
          </div>

          <!-- Boton agregar -->
          @if(encargos().length !== 0){
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 
            justify-between my-4 items-center transition-colors"
            (click)="agregar_encargo()">
              <div class="w-full flex justify-center items-center agregar-padre cursor-pointer">
                <div class="flex justify-center items-center border-2 rounded">
                  <ng-icon class="text-4xl border-r-2" name="agregar" />
                  <span class="text-2xl px-2 select-none">Agregar otro dulce</span>
                </div>
              </div>
  
              <div class="flex w-full justify-center space-x-2 text-2xl select-none">
                <p>Precio Estimado:</p>
                <p>{{precio()}} CUP</p>
              </div>
            </div>

            <div class="text-center mt-12">
                <button 
                (click)="abrirDialog()"
                class="bg-green-500 hover:bg-green-600 text-white font-semibold 
                px-8 py-3 rounded-full shadow-lg hover:shadow-xl transition-all duration-300 
                transform cursor-pointer">
                    PEDIR ENCARGO
                </button>
            </div>
          }

        </div>
      </div>


<!-- Dialog de validación -->
      @if (mostrarDialog()) {
        <validar-encargo-dialog
          [encargos]="encargos()"
          [precioTotal]="precio()"
          (cerrarDialog)="cerrarDialog()"
          (confirmarPedido)="confirmarPedido($event)">
        </validar-encargo-dialog>
      }
    </section>

<style>
    .agregar-padre:hover {
    @reference "tailwindcss";
    div {
        @apply border-green-700;

        ng-icon {
        @apply text-green-700;
        }
        span{
        @apply text-green-700;
        }
    }
    }
</style>
