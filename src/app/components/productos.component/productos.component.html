<section class="py-16 bg-white select-none">
    <div class="container mx-auto px-4 max-w-7xl">
        <h2 class="text-3xl md:text-4xl font-light text-center text-gray-800 mb-12 tracking-wide">
            Dulces <span class="font-bold text-delys-primary">Artesanales</span>
        </h2>


                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                @for (dulce of ofertas(); track $index) {
                    @if (mostrar_todos() || $index < 5) {
                        <div class="group bg-white rounded-lg overflow-hidden shadow-sm hover:shadow-lg transition-all duration-300">
                            <div
                                [style.background-image]="`url('${dulce.imagen}')`"
                                class="aspect-square bg-cover bg-center bg-gray-100 relative">
                                
                                <!-- Overlay sutil en hover -->
                                <div class="absolute inset-0 bg-black/0 group-hover:bg-black/20 transition-colors duration-300"></div>
                                
                                <!-- Precio flotante -->
                                <div class="absolute top-2 left-2 bg-white/90 backdrop-blur-sm
                                text-green-800 font-bold px-2 py-1 rounded text-xs shadow-sm">
                                    {{dulce.precio}} <span class="text-green-900">CUP</span>
                                </div>
                            </div>
                            
                            <div class="p-3 text-center">
                                <p class="text-sm font-medium text-gray-800 truncate">{{dulce.nombre}}</p>
                                <!-- <p class="text-xs text-gray-500 mt-1">{{dulce.precio}} CUP</p> -->
                            </div>
                        </div>
                    }
                }

            </div>

            <!-- Botón de ver más -->
            @if (!mostrar_todos() && ofertas().length > 5) {
                <div class="text-center mt-12">
                    <button 
                    (click)="mostrar_todos.set(true)"
                    class="bg-green-700 hover:bg-green-800 text-white font-semibold 
                    px-8 py-3 rounded-full shadow-lg hover:shadow-xl transition-all duration-300 
                    transform hover:scale-105 cursor-pointer">
                        Ver todos los dulces →
                    </button>
                </div>
            }

        <a [href]="whatsappLink" 
        target="_blank"
        class="flex w-full justify-center pt-10 ">
            <button class = "font-black flex border-2 rounded-lg px-4 py-2 bg-delys-primary 
            text-2xl text-white cursor-pointer transition-all
            hover:scale-105">
                <span>Encargue se dulce</span>
                <span class="flex items-center px-1 font-bold">
                    <ng-icon name="whatsap"/>
                </span>
            </button>
        </a>
    </div>
</section>
